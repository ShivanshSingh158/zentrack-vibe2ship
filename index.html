<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_white.png" />
    <!-- Dynamic Theme Init: Runs synchronously BEFORE render to eliminate any black or white theme flash on refresh -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('zen_theme');
          var isLight = t === 'light' || t === 'plain' || t === null;
          var doc = document.documentElement;
          if (isLight) {
            doc.classList.add('theme-light', 'theme-plain');
            doc.classList.remove('theme-dark');
            doc.style.backgroundColor = '#f6f8fa';
            doc.style.colorScheme = 'light';
          } else {
            doc.classList.add('theme-dark');
            doc.classList.remove('theme-light', 'theme-plain');
            doc.style.backgroundColor = '#09080c';
            doc.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fa" id="zen-theme-color">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('zen_theme');
          var isDark = t === 'dark';
          var tc = document.getElementById('zen-theme-color');
          if (tc) tc.setAttribute('content', isDark ? '#09080c' : '#f6f8fa');
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="/icon-192.png">

    <!--
      PERFORMANCE: bg-video.mp4 preload REMOVED.
      Authenticated users never see the landing page. Preloading a video
      file on every page load wasted 5–10MB of mobile bandwidth for every
      logged-in user on every app open.
      The Landing component lazy-loads the video element itself when needed.
    -->

    <!--
      Fonts: preconnect first, then non-blocking stylesheet load.
      Using media="print" trick: browser loads font CSS without blocking render,
      then swaps to screen media when done. This eliminates render-blocking font CSS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    >
    <!-- Fallback for no-JS environments -->
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    </noscript>

    <!-- KaTeX CSS: loaded non-blocking (only used in learning/agent modules) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
      integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q710xrm/QbB"
      crossorigin="anonymous"
      media="print"
      onload="this.media='all'"
    >

    <title>ZenTrack</title>

    <!-- BYPASS STALE PWA SERVICE WORKERS ON FIREBASE AUTH DOMAIN -->
    <script>
      if (window.location.pathname.startsWith('/__/')) {
        navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
          window.location.reload();
        });
      }
    </script>
  </head>
  <body>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('zen_theme');
          var isLight = t === 'light' || t === 'plain' || t === null;
          if (isLight) {
            document.body.className = 'theme-plain theme-light';
            document.body.style.backgroundColor = '#f6f8fa';
          } else {
            document.body.className = 'theme-dark';
            document.body.style.backgroundColor = '#09080c';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
